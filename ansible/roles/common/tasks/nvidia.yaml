- name: Add NVIDIA CUDA repository
  ansible.builtin.deb822_repository:
    name: nvidia-cuda
    types: deb
    uris: https://developer.download.nvidia.com/compute/cuda/repos/debian12/x86_64
    suites: /
    signed_by: https://developer.download.nvidia.com/compute/cuda/repos/debian12/x86_64/3bf863cc.pub
    architectures: amd64
    state: present
  register: nvidia_repo

- name: Add NVIDIA Container Toolkit repository
  ansible.builtin.deb822_repository:
    name: nvidia-container-toolkit
    types: deb
    uris: https://nvidia.github.io/libnvidia-container/stable/deb/amd64
    suites: /
    architectures: amd64
    signed_by: https://nvidia.github.io/libnvidia-container/gpgkey
    state: present
  register: nvidia_container_repo

- name: Update apt cache after adding NVIDIA repository
  ansible.builtin.apt:
    update_cache: true
  when: (nvidia_repo is changed) or (nvidia_container_repo is changed)

- name: Install headless NVIDIA 580 compute driver and container toolkit
  ansible.builtin.apt:
    name:
      - nvidia-driver-pinning-580
      - nvidia-driver-cuda
      - nvidia-kernel-open-dkms
      - nvidia-container-toolkit
    state: present
    install_recommends: false
  register: nvidia_packages

- name: Reboot to load NVIDIA kernel module
  ansible.builtin.reboot:
    reboot_timeout: 600
  when: nvidia_packages is changed

- name: Check GPUs
  ansible.builtin.command:
    cmd: nvidia-smi --query-gpu=index,name,memory.total,driver_version --format=csv
  register: nvidia_gpus
  changed_when: false

- name: Display GPUs
  ansible.builtin.debug:
    var: nvidia_gpus.stdout_lines
