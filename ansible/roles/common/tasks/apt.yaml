- name: Configure Debian main repository
  ansible.builtin.deb822_repository:
    name: debian
    types: deb
    uris: https://deb.debian.org/debian
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
      - "{{ ansible_facts['distribution_release'] }}-updates"
    components: [main, contrib, non-free, non-free-firmware]
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
    state: present

- name: Configure Debian security repository
  ansible.builtin.deb822_repository:
    name: debian-security
    types: deb
    uris: https://deb.debian.org/debian-security
    suites:
      - "{{ ansible_facts['distribution_release'] }}-security"
    components: [main, contrib, non-free, non-free-firmware]
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
    state: present

- name: Deploy APT post-invoke hook for DKMS safety check
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99-dkms-check
    owner: root
    group: root
    mode: "0644"
    force: false
    content: |
      DPkg::Post-Invoke {
          "if command -v dkms >/dev/null && dkms status | grep -Ei 'broken|error|failed'; then echo '[CRITICAL] DKMS compilation failed! Do not reboot!' >&2; exit 1; fi";
      };

- name: Update and upgrade apt packages
  ansible.builtin.apt:
    upgrade: "yes"
    update_cache: true
    cache_valid_time: 86400

- name: Check if reboot required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Assert critical DKMS modules are installed
  when: reboot_required_file.stat.exists
  ansible.builtin.assert:
    that:
      - dkms_check.stdout is not search('broken|error|failed')
    fail_msg: >-
      DKMS compilation failed! Reboot aborted to protect system.
      Output: {{ dkms_check.stdout }}
    success_msg: "DKMS kernel modules are properly installed."

- name: Reboot if required
  when: reboot_required_file.stat.exists
  ansible.builtin.reboot: {}
  register: rebooted

- name: Regathering facts variables if is rebooted # noqa: no-handler
  when: rebooted is changed
  ansible.builtin.setup: {}

- name: Install utils packages (sudo, curl, htop and btop)
  ansible.builtin.apt:
    pkg:
      - sudo
      - curl
      - htop
      - btop

- name: Install linux-header needed to build ZFS module and Nvidia driver
  ansible.builtin.apt:
    name: "linux-headers-{{ ansible_facts['kernel'] }}"
    state: present
