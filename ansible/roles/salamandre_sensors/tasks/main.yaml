- name: Add coolercontrol repository (Provide DKMS package for the it87)
  ansible.builtin.deb822_repository:
    name: coolercontrol
    types: deb
    uris: https://apt.coolercontrol.org/debian
    suites: stable
    architectures: amd64
    signed_by: https://apt.coolercontrol.org/coolercontrol-archive-keyring.gpg
    state: present
  register: coolercontrol

- name: Update apt cache after adding coolercontrol repository
  ansible.builtin.apt:
    update_cache: true
  when: coolercontrol is changed

- name: Install sensors package
  ansible.builtin.apt:
    pkg:
      - lm-sensors
      - it87-dkms

- name: Configure motherboard sensors
  ansible.builtin.copy:
    dest: /etc/sensors.d/it{{ motherboard_chip }}
    src: sensors/it{{ motherboard_chip }}
    mode: "u=rw,g=r,o=r"

- name: Configure modprobe parameters for it87
  ansible.builtin.copy:
    dest: /etc/modprobe.d/it87.conf
    content: "options it87 force_id=0x{{ motherboard_chip }} ignore_resource_conflict=1\n"
    mode: "u=rw,g=r,o=r"

- name: Ensure it87 is loaded at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/it87.conf
    content: "it87\n"
    mode: "u=rw,g=r,o=r"

- name: Load system modules temp
  ansible.builtin.copy:
    dest: /etc/modules-load.d/system.conf
    src: modules/system.conf
    mode: "u=rw,g=r,o=r"

- name: Setup it87 driver with DKMS
  when: "'installed' not in dkms_check.stdout"

- name: Ensure it87 module is loaded in running kernel
  community.general.modprobe:
    name: it87
    params: "force_id=0x{{ motherboard_chip }} ignore_resource_conflict=1"
    state: present

- name: Install and configure fancontrol
  ansible.builtin.import_tasks: fancontrol.yaml
