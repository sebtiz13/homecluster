# TLS/HTTPS Configuration:
# TLS to secure the REST API with HTTPS. (enabled by default)
# When enabled, a self-signed certificate will be automatically generated on first startup if no
# certificate paths are specified. The certificate and key are stored in /etc/coolercontrol/ by
# default.
# Note: Self-signed certificates will cause browser warnings. You can provide your own
# certificate by specifying the paths below, or use a reverse proxy (nginx, caddy, traefik)
# to handle TLS termination as an alternative approach.
# tls_enabled = true
# tls_cert_path = "/etc/coolercontrol/coolercontrol.crt"
# tls_key_path = "/etc/coolercontrol/coolercontrol.key"

# Reverse Proxy / CORS Configuration:
# Custom origins to allow in CORS requests. This is useful when accessing CoolerControl through
# a reverse proxy with a custom domain, or via port forwarding with a public IP. Add the full
# origin URL (scheme + host + port if non-standard). Only read from this file, at startup.
# origins = ["https://coolercontrol.mydomain.com", "http://192.168.1.1:8080"]

# Embedding the UI in another page:
# The origins of pages that may show the CoolerControl UI inside an iframe, such as a server
# dashboard. By default no page may. Only list pages you trust: a page that frames the UI can
# trick a logged-in user into clicking things in it.
# - Write each origin exactly as the browser shows the embedding page's address: scheme, host
#   and port, without a path. The host must be written the same way too. A page opened by IP
#   address needs that IP address here, and a page opened by name needs that name.
# - An IPv6 address such as "https://[2001:db8::1]:9090" cannot be listed. It is a valid
#   address for a browser to open, but the security header that carries this list has no way
#   to write one. Open the embedding page by hostname or IPv4 address and list that instead.
# - An entry that is not an exact origin is ignored, with a warning in the log at startup.
# - At most 16 entries are read. Any after the first 16 are ignored, with a warning as well.
# - Only read from this file, at startup. Restart the daemon after changing it.
# - The login only holds inside the frame when the embedding page and CoolerControl are opened
#   with the same scheme, normally HTTPS, and at the same host or domain.
# - Prefer "https" origins. A page served over plain "http" can be replaced by anyone on the
#   network path between the browser and that page, who could then frame the UI in its place.
# frame_ancestors = ["https://dashboard.mydomain.com:9090", "https://192.168.1.10:9090"]

# Header to check for the client's original protocol when behind a reverse proxy. Common values
# are "X-Forwarded-Proto" (nginx, Apache) or "X-Scheme". When this header indicates "https",
# the HTTP-to-HTTPS redirect is skipped (the proxy handles TLS termination).
# protocol_header = "X-Forwarded-Proto"

# Reverse proxies whose X-Forwarded-For header names the real client, as addresses or CIDR
# ranges. Login throttling then counts each client separately instead of lumping everyone
# behind the proxy together. Only list proxies you run: any listed address can claim to be any
# client. Listing 127.0.0.1 or ::1 extends that to every local user of this machine.
# A proxy on this machine connects from loopback, so its clients share the local app's
# connection budget.
# trusted_proxies = ["127.0.0.1", "::1"]

# Allow unencrypted HTTP connections from non-localhost addresses. By default, non-localhost
# HTTP requests are redirected to HTTPS when TLS is enabled. Set this to true to allow HTTP.
# Note: This should only be used as a last resort and is not recommended.
# allow_unencrypted = false

# Whether a remote device-service plugin must present a TLS certificate whose fingerprint
# you pinned in advance. When disabled (the default), the daemon trusts a remote the first
# time it connects, records that certificate's fingerprint in a "tls_pin" file inside the
# plugin's directory, and refuses the connection if it ever changes. Enable this to refuse
# unknown remotes outright; you then have to write the expected fingerprint into that
# "tls_pin" file yourself. A TLS connection to localhost is trusted without a pin while this
# is disabled, but needs one like any other once it is enabled.
# This only applies to connections that use TLS at all: a plugin reached over a Unix socket
# or plain TCP has no certificate to pin. Placing a "token" file in a plugin's directory is
# what switches its connection to TLS, unless its manifest sets "tls" explicitly.
# tls_strict = false

# Whether to auto-detect Super-I/O hardware sensors and load the appropriate kernel
# modules at startup. This helps ensure all hwmon chips are available. (x86_64 only)
# sensors_auto_detect = true

# Whether to apply the "label" and "ignore" statements from the lm-sensors configuration files
# (/etc/sensors3.conf, /etc/sensors.conf and /etc/sensors.d/). Labels set there replace the ones
# the kernel driver reports, and ignored sensors are hidden. Names set in CoolerControl itself
# always win. The files are read once at startup and are never written to.
# sensors_conf_enabled = true

# Whether to listen for kernel device add/remove events (e.g. USB hotplug) at startup.
# When enabled, the daemon watches for hardware changes and notifies connected clients.
# Requires netlink socket access, which containers may not have.
# device_listener_enabled = false

# Whether to log at DEBUG level. Debug output is large and is kept out of the in-app log view,
# so turn it off once the logs are collected. Read at startup; a change applies after a restart.
# The CC_LOG environment variable or the --debug flag can also raise the level.
# debug_logging = false

# Power profile to Mode mapping:
# When the system power profile changes, CoolerControl activates the Mode mapped to the new
# profile. The profile is read over D-Bus from power-profiles-daemon or the tuned-ppd shim;
# TLP does not expose one. Profiles left unmapped are ignored, and the mapping is also editable
# from the Modes page in the UI. Every change is published on the SSE "system" event whether or
# not a Mode is mapped.
# [power_profile_modes]
# power-saver = "<mode uid>"
# balanced = "<mode uid>"
# performance = "<mode uid>"

