apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  values:
    vmsingle:
      ingress:
        enabled: true
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: monitoring-vm-auth@kubernetescrd
          traefik.ingress.kubernetes.io/router.entrypoints: monitoring
        hosts:
          - &host monitor.${DOMAIN_NAME}
        tls:
          - hosts:
              - *host
      spec:
        extraArgs:
          search.maxConcurrentRequests: "4"
          search.maxQueueDuration: 30s
          search.maxQueryDuration: 60s
          search.logSlowQueryDuration: 10s
          fs.disableMincore: "true"
        retentionPeriod: "3" # 3 months
        storage:
          storageClassName: openebs-zfspv
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 70Gi
        resources:
          requests:
            cpu: 200m
            memory: 2048Mi
          limits:
            memory: 2048Mi
    vmagent:
      spec:
        externalLabels:
          cluster: baku

    external:
      grafana:
        host: https://monitor.${DOMAIN_NAME}/
    vmalert:
      spec:
        resources:
          requests:
            cpu: 18m
            memory: 128Mi
          limits:
            memory: 128Mi

    alertmanager:
      spec:
        resources:
          requests:
            cpu: 3m
            memory: 52Mi
          limits:
            memory: 52Mi
      useManagedConfig: true
      config:
        inhibit_rules:
          - target_matchers:
              - severity="info"
            source_matchers:
              - alertname=InfoInhibitor
        route:
          receiver: discord
          routes:
            - matchers:
                - alertname=InfoInhibitor
              receiver: blackhole
            - matchers:
                - alertname=Watchdog
              group_interval: 24h
              receiver: discord-watchdog
              continue: false
        receivers:
          - name: blackhole
          - name: discord
            discord_configs:
              - webhook_url: "${ALERTS_DISCORD_WEBHOOK_URL}"
                title: '{{ template "homecluster.discord.title" . }}'
                message: '{{ template "homecluster.discord.message" . }}'
          - name: discord-watchdog
            discord_configs:
              - webhook_url: "${WATCHDOG_DISCORD_WEBHOOK_URL}"
                title: '{{ template "homecluster.discord.title" . }}'
                message: '{{ template "homecluster.discord.message" . }}'
      monzoTemplate:
        enabled: false

      templateFiles:
        discord.tmpl: |-
          {{- define "homecluster.discord.title" }}
          {{- $firing := len .Alerts.Firing -}}
          {{- $resolved := len .Alerts.Resolved -}}

          {{- if .CommonLabels.cluster }}[{{ .CommonLabels.cluster }}] {{ end -}}
          {{- if and (gt $firing 0) (gt $resolved 0) -}}
          {{ $firing }} firing, {{ $resolved }} resolved
          {{- else if gt $firing 0 -}}
          {{ $firing }} alert{{ if gt $firing 1 }}s{{ end }} firing
          {{- else if gt $resolved 0 -}}
          {{ $resolved }} alert{{ if gt $resolved 1 }}s{{ end }} resolved
          {{- else -}}
          Alert notification
          {{- end -}}

          {{- if .CommonLabels.alertname }} - {{ .CommonLabels.alertname }}{{ end -}}
          {{- if .CommonLabels.job }} ({{ .CommonLabels.job }}){{ end -}}
          {{- end }}

          {{- define "homecluster.discord.severityEmoji" -}}
          {{- $severity := . | default "unknown" | lower -}}
          {{- if eq $severity "critical" -}}
          :red_circle:
          {{- else if eq $severity "warning" -}}
          :orange_circle:
          {{- end -}}
          {{- end }}

          {{- define "homecluster.discord.message" }}
          {{- $alerts := 0 -}}
          {{- if gt (len .Alerts.Firing) 0 -}}
          {{- $alerts = .Alerts.Firing -}}
          {{- else -}}
          {{- $alerts = .Alerts.Resolved -}}
          {{- end -}}
          {{- range $alerts }}
          - {{- template "homecluster.discord.severityIcon" .Labels.severity }} [{{ .Labels.alertname }}] **{{ if gt (len .Annotations.summary) 150 -}}
              {{- printf "%.150s..." .Annotations.summary -}}
              {{- else -}}
              {{- .Annotations.summary -}}
              {{- end }}**
            Description:
            > {{ if gt (len .Annotations.description) 150 -}}
              {{- printf "%.150s..." .Annotations.description | reReplaceAll "\\n" "\\n  > " }}
              {{- else -}}
              {{- .Annotations.description | reReplaceAll "\\n" "\\n  > " }}
              {{- end }}
            {{- if or .Labels.cluster .Labels.node .Labels.namespace .Labels.pod .Labels.container }}
            Labels:
            > {{- if .Labels.cluster }} cluster=`{{ .Labels.cluster }}`{{ end -}}
              {{- if .Labels.node }} node=`{{ .Labels.node }}`{{ end -}}
              {{- if .Labels.namespace }} namespace=`{{ .Labels.namespace }}`{{ end -}}
              {{- if .Labels.pod }} pod=`{{ .Labels.pod }}`{{ end -}}
              {{- if .Labels.container }} container=`{{ .Labels.container }}`{{ end -}}
            {{- end }}
          {{- end }}

          {{ if and (gt (len .Alerts.Firing) 0) (gt (len .Alerts.Resolved) 0) }}
          Also {{ .Alerts.Resolved | len }} resolved alerts.
          {{- end }}
          {{- end }}

    defaultRules:
      enabled: true
      rules:
        KubeAPIDown:
          enabled: false
        KubeAPIInstanceUnreachable:
          enabled: false
        KubeMemoryOvercommit:
          enabled: false

      groups:
        etcd: # k3s useless cause it use sqlite
          enabled: false
        vmcluster:
          enabled: false
        vmagent: # remove dashboard annotation
          rules:
            spec:
              annotations:
                dashboard: ""

        ## In k3s alls bellow components is combined in "kubelet"
        kube-scheduler.rules:
          enabled: false
        kubernetes-system-controller-manager:
          enabled: false
        kubernetes-system-scheduler:
          enabled: false

        # Disable useless records
        kube-apiserver-availability.rules:
          enabled: false
        kube-apiserver-burnrate.rules:
          enabled: false
        kube-apiserver-histogram.rules:
          enabled: false
        kube-apiserver-slos:
          enabled: false
