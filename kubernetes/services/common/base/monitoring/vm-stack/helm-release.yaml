---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  releaseName: vm-stack
  interval: 30m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "0.90.2"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
      interval: 12h
  install:
    createNamespace: true
    crds: Skip
  upgrade:
    crds: Skip
  values:
    kubelet:
      vmScrape:
        spec:
          interval: "30s"
          metricRelabelConfigs:
            # --- Chart defaults (kept as-is) ---
            # Drop the volatile pod/container UID label to avoid a new series on every pod restart.
            - action: labeldrop
              regex: (uid)
            # Drop generic 'id'/'name' labels inherited from cAdvisor container metadata.
            - action: labeldrop
              regex: (id|name)
            # Drop rest_client histogram + its sum/count; not needed for basic alerting/overview.
            - action: drop
              source_labels: [__name__]
              regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)

            # --- node labels: drop redundant/uninformative labels copied via labelmap ---
            - action: labeldrop
              regex: (beta_kubernetes_io_.*|kubernetes_io_arch|kubernetes_io_os|node_kubernetes_io_instance_type|node_role_kubernetes_io_.*|openebs_io_.*)

            # --- apiserver: drop noisy/low-signal metric families ---
            - action: drop
              source_labels: [__name__]
              regex: (apiextensions_apiserver_.*|authenticated_user_requests|authentication_duration_seconds_bucket|authorization_duration_seconds_bucket)

            # --- apiserver: drop excessively noisy request/response histograms ---
            - action: drop
              source_labels: [__name__]
              regex: (apiserver_request_duration_seconds_bucket|apiserver_request_slo_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|apiserver_request_body_size_bytes_bucket|apiserver_watch_list_duration_seconds_bucket|apiserver_watch_cache_read_wait_seconds_bucket)

            # --- apiserver: drop feature areas not relevant to a single-node ---
            - action: drop
              source_labels: [__name__]
              regex: (apiserver_flowcontrol_.*|apiserver_admission_webhook_admission_duration_seconds_bucket|apiserver_admission_step_admission_duration_seconds_bucket|apiserver_admission_controller_admission_duration_seconds_bucket|etcd_request_duration_seconds_bucket)

            # --- kubelet/workqueue: drop internal operation histograms ---
            - action: drop
              source_labels: [__name__]
              regex: (kubelet_runtime_operations_duration_seconds_bucket|kubelet_pod_worker_duration_seconds_bucket|kubelet_cgroup_manager_duration_seconds_bucket|storage_operation_duration_seconds_bucket|workqueue_queue_duration_seconds_bucket|workqueue_work_duration_seconds_bucket)

            # --- cAdvisor: drop low-value container-level metrics ---
            - action: drop
              source_labels: [__name__]
              regex: (container_tasks_state|container_memory_failures_total|container_memory_mapped_file|container_network_tcp_usage_total|container_network_udp_usage_total|container_blkio_.*)

            # --- K3S: job rename: reclassify apiserver_* and aggregator_unavailable_apiservice metrics scraped through the kubelet endpoint ---
            - action: replace
              source_labels: [__name__]
              regex: 'apiserver_.*'
              target_label: job
              replacement: apiserver
            - action: replace
              source_labels: [__name__]
              if: 'aggregator_unavailable_apiservice'
              target_label: job
              replacement: apiserver

    prometheus-node-exporter:
      fullnameOverride: node-exporter
      resources:
        requests:
          cpu: 15m
          memory: 34Mi
        limits:
          memory: 34Mi

      vmScrape:
        spec:
          endpoints:
            - port: metrics
              metricRelabelConfigs:
                - action: drop
                  source_labels: [mountpoint]
                  regex: "/var/lib/kubelet/pods.+"
                - action: labeldrop
                  regex: (uid|id|beta_kubernetes_io_.*|kubernetes_io_arch|kubernetes_io_os|node_kubernetes_io_instance_type|node_role_kubernetes_io_.*)
              relabelConfigs:
                # Add "node" label
                - sourceLabels: [__meta_kubernetes_endpoint_node_name]
                  targetLabel: node

    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      resources:
        requests:
          cpu: 4m
          memory: 129Mi
        limits:
          memory: 129Mi

      # export Flux CR readiness as gotk_resource_info metrics (Flux
      # controllers no longer expose per-resource status themselves - this is
      # the flux2-monitoring-example approach). Powers the flux-alerts
      # VMRule, most importantly FluxGitSourceNotReady: the "GitHub token
      # expired, cluster silently frozen" alarm (bitten by this 2026-07).
      rbac:
        extraRules:
          - apiGroups:
              - source.toolkit.fluxcd.io
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - helmrepositories
              - ocirepositories
              - kustomizations
              - helmreleases
            verbs: [ "list", "watch" ]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Kustomization resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, lastAppliedRevision ]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRelease resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, history, "0", chartVersion ]
                      chart_name: [ status, history, "0", chartName ]
                      chart_app_version: [ status, history, "0", appVersion ]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux GitRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, artifact, revision ]
                      url: [ spec, url ]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, artifact, revision ]
                      url: [ spec, url ]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: OCIRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux OCIRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, artifact, revision ]
                      url: [ spec, url ]

      vmScrape:
        spec:
          endpoints:
            - port: http
              honorLabels: true
              metricRelabelConfigs:
                - action: labeldrop
                  regex: (uid|id|replicaset|endpoint_slice|container_id|image_id|beta_kubernetes_io_.*|kubernetes_io_arch|kubernetes_io_os|node_kubernetes_io_instance_type|node_role_kubernetes_io_.*|openebs_io_.*)
                - action: drop
                  source_labels: [__name__]
                  regex: (kube_secret_.*|kube_configmap_.*|kube_endpoint.*|kube_lease_.*|kube_.+_created|kube_.+_metadata_resource_version|kube_pod_init_container_.*)

    victoria-metrics-operator:
      fullnameOverride: victoria-metrics-operator

      resources:
        requests:
          cpu: 14m
          memory: 116Mi
        limits:
          memory: 116Mi

      operator:
        enable_converter_ownership: true

      serviceMonitor:
        enabled: true
        relabelings:
          # Drop of highest cardinality and useless labels (churn)
          - action: drop
            source_labels: [__name__]
            regex: (flag|config_parameter)

      # Disable CRDs
      crds:
        enabled: false
        plain: false
        cleanup:
          enabled: false

    # Global resources
    vmagent:
      spec:
        resources:
          requests:
            cpu: 67m
            memory: 368Mi
          limits:
            memory: 368Mi

    ## In k3s alls bellow components is combined in "kubelet"
    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false


    # Disable global alert rules (re enabled only on baku)
    defaultRules:
      enabled: false
    # Disable default grafana dashboards
    defaultDashboards:
      enabled: false
    ## Disable embedded grafana for deploy own
    grafana:
      enabled: false
    # Disable CRDs
    prometheus-operator-crds:
      enabled: false

    fullnameOverride: vm-stack
