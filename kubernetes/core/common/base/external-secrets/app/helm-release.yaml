---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name external-secrets
spec:
  releaseName: *name
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      version: "2.9.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  install:
    createNamespace: true
  values:
    priorityClassName: system-cluster-critical

    # Disable CRD
    installCRDs: false

    resources:
      requests:
        cpu: 3m
        memory: 91Mi
      limits:
        memory: 91Mi

    webhook:
      resources:
        requests:
          cpu: 2m
          memory: 46Mi
        limits:
          memory: 46Mi

    certController:
      resources:
        requests:
          cpu: 4m
          memory: 171Mi
        limits:
          memory: 171Mi
