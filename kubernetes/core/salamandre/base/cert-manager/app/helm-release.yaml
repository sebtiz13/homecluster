---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name cert-manager
spec:
  releaseName: *name
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
  install:
    createNamespace: true
  values:
    installCRDs: false

    global:
      priorityClassName: system-cluster-critical

    resources:
      requests:
        cpu: 3m
        memory: 70Mi
      limits:
        memory: 70Mi

    webhook:
      resources:
        requests:
          cpu: 1m
          memory: 36Mi
        limits:
          memory: 36Mi

    cainjector:
      resources:
        requests:
          cpu: 3m
          memory: 118Mi
        limits:
          memory: 118Mi
